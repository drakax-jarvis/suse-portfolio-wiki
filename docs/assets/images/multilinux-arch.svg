<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 520" width="750" height="520">
  <rect width="750" height="520" fill="#ffffff" rx="6"/>

  <defs>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#757575"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="375" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle">SUSE MultiLinux Manager Architecture</text>

  <!-- ===== SUSE MultiLinux Manager (top, wide) ===== -->
  <rect x="100" y="50" width="550" height="110" rx="6" fill="#e0f2f1" stroke="#009688" stroke-width="2"/>
  <rect x="100" y="50" width="550" height="32" rx="6" fill="#009688"/>
  <rect x="100" y="76" width="550" height="6" fill="#009688"/>
  <text x="375" y="70" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">SUSE MultiLinux Manager</text>

  <!-- Manager sub-components row -->
  <rect x="115" y="95" width="115" height="25" rx="4" fill="#ffffff" stroke="#009688" stroke-width="1"/>
  <text x="172" y="112" font-family="sans-serif" font-size="10" fill="#004d40" text-anchor="middle">Web UI</text>

  <rect x="240" y="95" width="105" height="25" rx="4" fill="#ffffff" stroke="#009688" stroke-width="1"/>
  <text x="292" y="112" font-family="sans-serif" font-size="10" fill="#004d40" text-anchor="middle">API</text>

  <rect x="355" y="95" width="90" height="25" rx="4" fill="#ffffff" stroke="#009688" stroke-width="1"/>
  <text x="400" y="112" font-family="sans-serif" font-size="10" fill="#004d40" text-anchor="middle">Database</text>

  <rect x="455" y="95" width="90" height="25" rx="4" fill="#ffffff" stroke="#009688" stroke-width="1"/>
  <text x="500" y="112" font-family="sans-serif" font-size="10" fill="#004d40" text-anchor="middle">Patch Repo</text>

  <rect x="555" y="95" width="80" height="25" rx="4" fill="#ffffff" stroke="#009688" stroke-width="1"/>
  <text x="595" y="112" font-family="sans-serif" font-size="10" fill="#004d40" text-anchor="middle">Salt Config</text>

  <!-- Connecting lines from Manager down to managed columns -->
  <!-- Left line to SLE -->
  <line x1="250" y1="160" x2="250" y2="200" stroke="#757575" stroke-width="2" marker-end="url(#arrowGray)"/>
  <!-- Center line to RHEL -->
  <line x1="375" y1="160" x2="375" y2="200" stroke="#757575" stroke-width="2" marker-end="url(#arrowGray)"/>
  <!-- Right line to Ubuntu -->
  <line x1="500" y1="160" x2="500" y2="200" stroke="#757575" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- Horizontal bus connecting all three columns to Manager -->
  <line x1="250" y1="190" x2="500" y2="190" stroke="#009688" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- ===== SLE Managed Systems (left column) ===== -->
  <rect x="60" y="205" width="250" height="200" rx="6" fill="#e0f2f1" stroke="#009688" stroke-width="2"/>
  <rect x="60" y="205" width="250" height="30" rx="6" fill="#009688"/>
  <rect x="60" y="229" width="250" height="6" fill="#009688"/>
  <text x="185" y="224" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">SLE Managed Systems</text>

  <!-- SLE server nodes -->
  <rect x="80" y="250" width="210" height="30" rx="4" fill="#ffffff" stroke="#009688" stroke-width="1"/>
  <text x="185" y="269" font-family="sans-serif" font-size="11" fill="#004d40" text-anchor="middle">SUSE Linux Enterprise Server 15</text>

  <rect x="80" y="290" width="210" height="30" rx="4" fill="#ffffff" stroke="#009688" stroke-width="1"/>
  <text x="185" y="309" font-family="sans-serif" font-size="11" fill="#004d40" text-anchor="middle">SUSE Linux Enterprise Server 12</text>

  <rect x="80" y="330" width="210" height="30" rx="4" fill="#ffffff" stroke="#009688" stroke-width="1"/>
  <text x="185" y="349" font-family="sans-serif" font-size="11" fill="#004d40" text-anchor="middle">SUSE Linux Enterprise Micro</text>

  <rect x="80" y="370" width="210" height="25" rx="4" fill="#f5f5f5" stroke="#9E9E9E" stroke-width="1"/>
  <text x="185" y="387" font-family="sans-serif" font-size="10" fill="#757575" text-anchor="middle">+ more SLE instances</text>

  <!-- ===== RHEL Managed Systems (center column) ===== -->
  <rect x="325" y="205" width="250" height="200" rx="6" fill="#e0f2f1" stroke="#009688" stroke-width="2"/>
  <rect x="325" y="205" width="250" height="30" rx="6" fill="#009688"/>
  <rect x="325" y="229" width="250" height="6" fill="#009688"/>
  <text x="450" y="224" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">RHEL Managed Systems</text>

  <!-- RHEL server nodes -->
  <rect x="345" y="250" width="210" height="30" rx="4" fill="#ffffff" stroke="#009688" stroke-width="1"/>
  <text x="450" y="269" font-family="sans-serif" font-size="11" fill="#004d40" text-anchor="middle">Red Hat Enterprise Linux 9</text>

  <rect x="345" y="290" width="210" height="30" rx="4" fill="#ffffff" stroke="#009688" stroke-width="1"/>
  <text x="450" y="309" font-family="sans-serif" font-size="11" fill="#004d40" text-anchor="middle">Red Hat Enterprise Linux 8</text>

  <rect x="345" y="330" width="210" height="30" rx="4" fill="#ffffff" stroke="#009688" stroke-width="1"/>
  <text x="450" y="349" font-family="sans-serif" font-size="11" fill="#004d40" text-anchor="middle">Red Hat Enterprise Linux 7</text>

  <rect x="345" y="370" width="210" height="25" rx="4" fill="#f5f5f5" stroke="#9E9E9E" stroke-width="1"/>
  <text x="450" y="387" font-family="sans-serif" font-size="10" fill="#757575" text-anchor="middle">+ more RHEL instances</text>

  <!-- ===== Ubuntu Managed Systems (right column) ===== -->
  <rect x="590" y="205" width="115" height="200" rx="6" fill="#e0f2f1" stroke="#009688" stroke-width="2"/>
  <rect x="590" y="205" width="115" height="30" rx="6" fill="#009688"/>
  <rect x="590" y="229" width="115" height="6" fill="#009688"/>
  <text x="647" y="224" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Ubuntu</text>

  <!-- Ubuntu server nodes - narrower to fit -->
  <rect x="600" y="250" width="95" height="30" rx="4" fill="#ffffff" stroke="#009688" stroke-width="1"/>
  <text x="647" y="262" font-family="sans-serif" font-size="10" fill="#004d40" text-anchor="middle">Ubuntu 24.04</text>

  <rect x="600" y="290" width="95" height="30" rx="4" fill="#ffffff" stroke="#009688" stroke-width="1"/>
  <text x="647" y="302" font-family="sans-serif" font-size="10" fill="#004d40" text-anchor="middle">Ubuntu 22.04</text>

  <rect x="600" y="330" width="95" height="30" rx="4" fill="#ffffff" stroke="#009688" stroke-width="1"/>
  <text x="647" y="342" font-family="sans-serif" font-size="10" fill="#004d40" text-anchor="middle">Ubuntu 20.04</text>

  <rect x="600" y="370" width="95" height="25" rx="4" fill="#f5f5f5" stroke="#9E9E9E" stroke-width="1"/>
  <text x="647" y="387" font-family="sans-serif" font-size="9" fill="#757575" text-anchor="middle">+ more</text>

  <!-- ===== Note box at bottom ===== -->
  <rect x="100" y="430" width="550" height="55" rx="6" fill="#fff8e1" stroke="#FFA000" stroke-width="2"/>
  <text x="375" y="452" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e65100" text-anchor="middle">Single console for patch, compliance, automate</text>
  <text x="375" y="472" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e65100" text-anchor="middle">across SUSE + RHEL + Ubuntu</text>
</svg>
