<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="112%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="cp-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5fffd"/>
      <stop offset="100%" stop-color="#e0f2f1"/>
    </linearGradient>
    <linearGradient id="worker-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#e8f5e9"/>
    </linearGradient>
  </defs>

  <!-- White background -->
  <rect width="720" height="560" fill="#ffffff" rx="0"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" fill="#009688" font-family="Arial, sans-serif" font-size="16" font-weight="bold">RKE2 Architecture — Control Plane &amp; Worker Node</text>

  <!-- ============================================================ -->
  <!-- RKE2 CONTROL PLANE BOX -->
  <!-- ============================================================ -->
  <rect x="20" y="40" width="680" height="320" rx="8" fill="#e0f2f1" stroke="#009688" stroke-width="2" filter="url(#shadow)"/>
  <rect x="20" y="40" width="680" height="32" rx="8" fill="#009688"/>
  <rect x="20" y="56" width="680" height="16" fill="#009688"/>
  <text x="360" y="62" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">RKE2 CONTROL PLANE</text>

  <!-- Control plane components row -->
  <rect x="45" y="85" width="130" height="40" rx="5" fill="#ffffff" stroke="#009688" stroke-width="2"/>
  <text x="110" y="109" text-anchor="middle" fill="#009688" font-family="Arial, sans-serif" font-size="12" font-weight="bold">API Server</text>

  <rect x="195" y="85" width="130" height="40" rx="5" fill="#ffffff" stroke="#009688" stroke-width="2"/>
  <text x="260" y="109" text-anchor="middle" fill="#009688" font-family="Arial, sans-serif" font-size="12" font-weight="bold">etcd</text>

  <rect x="345" y="85" width="130" height="40" rx="5" fill="#ffffff" stroke="#009688" stroke-width="2"/>
  <text x="410" y="109" text-anchor="middle" fill="#009688" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Scheduler</text>

  <rect x="495" y="85" width="140" height="40" rx="5" fill="#ffffff" stroke="#009688" stroke-width="2"/>
  <text x="565" y="109" text-anchor="middle" fill="#009688" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Controller Mgr</text>

  <!-- Down arrows from components -->
  <line x1="110" y1="125" x2="110" y2="148" stroke="#009688" stroke-width="1.5"/>
  <line x1="260" y1="125" x2="260" y2="148" stroke="#009688" stroke-width="1.5"/>
  <line x1="410" y1="125" x2="410" y2="148" stroke="#009688" stroke-width="1.5"/>
  <line x1="565" y1="125" x2="565" y2="148" stroke="#009688" stroke-width="1.5"/>

  <!-- Connector line -->
  <line x1="110" y1="148" x2="565" y2="148" stroke="#009688" stroke-width="1.5"/>
  <line x1="340" y1="148" x2="340" y2="163" stroke="#009688" stroke-width="1.5"/>
  <!-- Arrow head -->
  <polygon points="340,163 335,154 345,154" fill="#009688"/>

  <!-- kubelet + kube-proxy row -->
  <rect x="45" y="170" width="310" height="38" rx="5" fill="#ffffff" stroke="#009688" stroke-width="1.5"/>
  <text x="200" y="194" text-anchor="middle" fill="#00796B" font-family="Arial, sans-serif" font-size="13" font-weight="bold">kubelet</text>

  <rect x="380" y="170" width="300" height="38" rx="5" fill="#ffffff" stroke="#009688" stroke-width="1.5"/>
  <text x="530" y="194" text-anchor="middle" fill="#00796B" font-family="Arial, sans-serif" font-size="13" font-weight="bold">kube-proxy</text>

  <!-- Arrow kubelet → containerd -->
  <line x1="200" y1="208" x2="200" y2="228" stroke="#009688" stroke-width="1.5"/>
  <polygon points="200,228 195,220 205,220" fill="#009688"/>

  <!-- containerd box -->
  <rect x="45" y="235" width="620" height="36" rx="5" fill="#ffffff" stroke="#009688" stroke-width="2"/>
  <text x="355" y="258" text-anchor="middle" fill="#00796B" font-family="Arial, sans-serif" font-size="13" font-weight="bold">containerd (CRI)</text>

  <!-- Arrow containerd → Static Pods -->
  <line x1="355" y1="271" x2="355" y2="291" stroke="#009688" stroke-width="1.5"/>
  <polygon points="355,291 350,283 360,283" fill="#009688"/>

  <!-- Static Pods box -->
  <rect x="45" y="298" width="620" height="50" rx="5" fill="#ffffff" stroke="#009688" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="355" y="316" text-anchor="middle" fill="#00796B" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Static Pods (Control Plane)</text>
  <text x="355" y="335" text-anchor="middle" fill="#78909c" font-family="Arial, sans-serif" font-size="11">etcd · kube-apiserver · kube-controller-manager · kube-scheduler · cloud-controller-manager</text>


  <!-- ============================================================ -->
  <!-- RKE2 WORKER NODE BOX -->
  <!-- ============================================================ -->
  <rect x="20" y="376" width="680" height="170" rx="8" fill="#f5f5f5" stroke="#00796B" stroke-width="2" filter="url(#shadow)"/>
  <rect x="20" y="376" width="680" height="32" rx="8" fill="#00796B"/>
  <rect x="20" y="392" width="680" height="16" fill="#00796B"/>
  <text x="360" y="398" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">RKE2 WORKER NODE</text>

  <!-- Worker components row -->
  <rect x="45" y="420" width="175" height="40" rx="5" fill="#ffffff" stroke="#00796B" stroke-width="1.5"/>
  <text x="132" y="444" text-anchor="middle" fill="#00796B" font-family="Arial, sans-serif" font-size="12" font-weight="bold">kubelet</text>

  <rect x="240" y="420" width="175" height="40" rx="5" fill="#ffffff" stroke="#00796B" stroke-width="1.5"/>
  <text x="327" y="444" text-anchor="middle" fill="#00796B" font-family="Arial, sans-serif" font-size="12" font-weight="bold">kube-proxy</text>

  <rect x="435" y="420" width="240" height="40" rx="5" fill="#ffffff" stroke="#00796B" stroke-width="1.5"/>
  <text x="555" y="444" text-anchor="middle" fill="#00796B" font-family="Arial, sans-serif" font-size="12" font-weight="bold">containerd</text>

  <!-- Arrow kubelet/containerd → pods -->
  <line x1="132" y1="460" x2="132" y2="478" stroke="#9E9E9E" stroke-width="1.5"/>
  <line x1="555" y1="460" x2="555" y2="478" stroke="#9E9E9E" stroke-width="1.5"/>
  <polygon points="132,478 127,470 137,470" fill="#9E9E9E"/>
  <polygon points="555,478 550,470 560,470" fill="#9E9E9E"/>

  <!-- Pods / Containers box -->
  <rect x="45" y="485" width="630" height="48" rx="5" fill="#ffffff" stroke="#9E9E9E" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="360" y="507" text-anchor="middle" fill="#616161" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Pods / Containers</text>
  <text x="360" y="524" text-anchor="middle" fill="#9E9E9E" font-family="Arial, sans-serif" font-size="10">Application workloads, DaemonSets, Deployments</text>

</svg>