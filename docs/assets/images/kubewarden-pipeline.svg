<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 380" width="750" height="380">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="teal-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#009688"/>
      <stop offset="100%" stop-color="#00695c"/>
    </linearGradient>
    <linearGradient id="orange-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7043"/>
      <stop offset="100%" stop-color="#d84315"/>
    </linearGradient>
  </defs>
  <rect width="750" height="380" fill="url(#bg-grad)" rx="8"/>
<text x="375" y="35" text-anchor="middle" fill="#eceff1" font-family="sans-serif" font-size="20" font-weight="bold">Kubewarden — Universal Policy Engine (CNCF Sandbox)</text>
<rect x="30" y="65" width="130" height="85" rx="8" fill="#16213e" stroke="#009688" stroke-width="1.5" filter="url(#shadow)"/>
<text x="95" y="85" text-anchor="middle" fill="#009688" font-family="sans-serif" font-size="13" font-weight="bold">Write</text>
<text x="95" y="105+j*18" text-anchor="middle" fill="#78909c" font-family="sans-serif" font-size="10">Rust · Go · CEL</text>
<text x="95" y="105+j*18" text-anchor="middle" fill="#78909c" font-family="sans-serif" font-size="10">Rego · JS · Swift</text>
<line x1="160" y1="107" x2="172" y2="107" stroke="#009688" stroke-width="2"/>
<polygon points="(172, 102) (178, 107) (172, 112)" fill="#009688"/>
<rect x="172" y="65" width="130" height="85" rx="8" fill="#16213e" stroke="#ff7043" stroke-width="1.5" filter="url(#shadow)"/>
<text x="237" y="85" text-anchor="middle" fill="#ff7043" font-family="sans-serif" font-size="13" font-weight="bold">Compile</text>
<text x="237" y="105+j*18" text-anchor="middle" fill="#78909c" font-family="sans-serif" font-size="10">to WebAssembly</text>
<line x1="302" y1="107" x2="314" y2="107" stroke="#009688" stroke-width="2"/>
<polygon points="(314, 102) (320, 107) (314, 112)" fill="#009688"/>
<rect x="314" y="65" width="130" height="85" rx="8" fill="#16213e" stroke="#42a5f5" stroke-width="1.5" filter="url(#shadow)"/>
<text x="379" y="85" text-anchor="middle" fill="#42a5f5" font-family="sans-serif" font-size="13" font-weight="bold">Push</text>
<text x="379" y="105+j*18" text-anchor="middle" fill="#78909c" font-family="sans-serif" font-size="10">OCI Registry</text>
<line x1="444" y1="107" x2="456" y2="107" stroke="#009688" stroke-width="2"/>
<polygon points="(456, 102) (462, 107) (456, 112)" fill="#009688"/>
<rect x="456" y="65" width="130" height="85" rx="8" fill="#16213e" stroke="#ab47bc" stroke-width="1.5" filter="url(#shadow)"/>
<text x="521" y="85" text-anchor="middle" fill="#ab47bc" font-family="sans-serif" font-size="13" font-weight="bold">Deploy</text>
<text x="521" y="105+j*18" text-anchor="middle" fill="#78909c" font-family="sans-serif" font-size="10">Kubewarden CRDs</text>
<text x="521" y="105+j*18" text-anchor="middle" fill="#78909c" font-family="sans-serif" font-size="10">ClusterAdmissionPolicy</text>
<line x1="586" y1="107" x2="598" y2="107" stroke="#009688" stroke-width="2"/>
<polygon points="(598, 102) (604, 107) (598, 112)" fill="#009688"/>
<rect x="598" y="65" width="130" height="85" rx="8" fill="#16213e" stroke="#66bb6a" stroke-width="1.5" filter="url(#shadow)"/>
<text x="663" y="85" text-anchor="middle" fill="#66bb6a" font-family="sans-serif" font-size="13" font-weight="bold">Enforce</text>
<text x="663" y="105+j*18" text-anchor="middle" fill="#78909c" font-family="sans-serif" font-size="10">Admission Webhook</text>
<text x="663" y="105+j*18" text-anchor="middle" fill="#78909c" font-family="sans-serif" font-size="10">WASM Sandbox</text>
<rect x="80" y="185" width="590" height="75" rx="8" fill="#16213e" stroke="#009688" stroke-width="1.5" filter="url(#shadow)"/>
<text x="375" y="208" text-anchor="middle" fill="#eceff1" font-family="sans-serif" font-size="12" font-weight="bold">Architecture: K8s API Server → Admission Review → Policy Server → WASM Runtime (wazero) → Allow/Deny</text>
<text x="375" y="228" text-anchor="middle" fill="#78909c" font-family="sans-serif" font-size="10">Each policy = one WASM module, one webhook endpoint · Isolated sandbox · Container registry distribution</text>
<text x="375" y="248" text-anchor="middle" fill="#78909c" font-family="sans-serif" font-size="10">New in v1.36: SBOM Scanner for SPDX-format Software Bill of Materials</text>
<text x="375" y="295" text-anchor="middle" fill="#eceff1" font-family="sans-serif" font-size="13" font-weight="bold">Kubewarden vs The Field</text>
<rect x="80" y="305" width="190" height="40" rx="6" fill="#16213e" stroke="#009688" stroke-width="1.5"/>
<text x="175" y="323" text-anchor="middle" fill="#eceff1" font-family="sans-serif" font-size="11" font-weight="bold">Kubewarden</text>
<text x="175" y="337" text-anchor="middle" fill="#78909c" font-family="sans-serif" font-size="9">Any language → WASM</text>
<rect x="290" y="305" width="190" height="40" rx="6" fill="#16213e" stroke="#ff7043" stroke-width="1.5"/>
<text x="385" y="323" text-anchor="middle" fill="#eceff1" font-family="sans-serif" font-size="11" font-weight="bold">OPA/Gatekeeper</text>
<text x="385" y="337" text-anchor="middle" fill="#78909c" font-family="sans-serif" font-size="9">Rego only</text>
<rect x="500" y="305" width="190" height="40" rx="6" fill="#16213e" stroke="#42a5f5" stroke-width="1.5"/>
<text x="595" y="323" text-anchor="middle" fill="#eceff1" font-family="sans-serif" font-size="11" font-weight="bold">Kyverno</text>
<text x="595" y="337" text-anchor="middle" fill="#78909c" font-family="sans-serif" font-size="9">YAML DSL only</text>
</svg>