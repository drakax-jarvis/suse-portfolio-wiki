<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="850" height="520">
  <defs>
    <marker id="arrow-down" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#009688"/>
    </marker>
    <marker id="arrow-right" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF5722"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="850" height="520" fill="#FFFFFF" rx="0"/>

  <!-- Title -->
  <text x="425" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333333">Fleet — Hub-and-Spoke GitOps Architecture</text>

  <!-- ===== Top: Rancher Prime (Hub) ===== -->
  <rect x="225" y="50" width="400" height="100" rx="10" ry="10" fill="#FFFFFF" stroke="#009688" stroke-width="2.5"/>
  <rect x="225" y="50" width="400" height="36" rx="10" ry="10" fill="#009688"/>
  <rect x="225" y="76" width="400" height="10" fill="#009688"/>
  <text x="425" y="73" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Rancher Prime (Hub)</text>

  <!-- Fleet Controller box inside -->
  <rect x="260" y="94" width="330" height="44" rx="8" ry="8" fill="#E0F2F1" stroke="#009688" stroke-width="2"/>
  <text x="425" y="112" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#009688">Fleet Controller</text>
  <text x="425" y="128" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555">Watches: GitRepo · Bundle · ClusterGroup CRDs → generates BundleDeployments</text>

  <!-- ===== Git Repository ===== -->
  <rect x="225" y="170" width="400" height="90" rx="10" ry="10" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="2"/>
  <rect x="225" y="170" width="400" height="30" rx="10" ry="10" fill="#9E9E9E"/>
  <rect x="225" y="190" width="400" height="10" fill="#9E9E9E"/>
  <text x="425" y="190" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Git Repository (source of truth)</text>

  <text x="425" y="218" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">my-fleet-app/</text>

  <rect x="245" y="228" width="100" height="22" rx="4" ry="4" fill="#E3F2FD" stroke="#1976D2" stroke-width="1"/>
  <text x="295" y="243" text-anchor="middle" font-family="monospace" font-size="10" fill="#1565C0">database/</text>
  <text x="305" y="243" font-family="sans-serif" font-size="9" fill="#888">(Helm)</text>

  <rect x="355" y="228" width="100" height="22" rx="4" ry="4" fill="#FFF8E1" stroke="#FF9800" stroke-width="1"/>
  <text x="405" y="243" text-anchor="middle" font-family="monospace" font-size="10" fill="#E65100">webapp/</text>
  <text x="415" y="243" font-family="sans-serif" font-size="9" fill="#888">(Kustomize)</text>

  <rect x="465" y="228" width="100" height="22" rx="4" ry="4" fill="#F3E5F5" stroke="#9C27B0" stroke-width="1"/>
  <text x="515" y="243" text-anchor="middle" font-family="monospace" font-size="10" fill="#6A1B9A">config/</text>
  <text x="525" y="243" font-family="sans-serif" font-size="9" fill="#888">(raw YAML)</text>

  <!-- Arrow: GitRepo → Fleet Controller -->
  <path d="M 425,260 L 425,275 L 425,290 L 425,304" fill="none" stroke="#FF5722" stroke-width="2" marker-end="url(#arrow-down)"/>

  <!-- ===== Dashed connection from Fleet Controller down to clusters ===== -->
  <path d="M 425,150 L 425,160" fill="none" stroke="#009688" stroke-width="2"/>

  <!-- ===== Bottom row: 3 clusters ===== -->
  <!-- Cluster A -->
  <rect x="30" y="320" width="240" height="175" rx="10" ry="10" fill="#FFFFFF" stroke="#009688" stroke-width="2.5"/>
  <rect x="30" y="320" width="240" height="36" rx="10" ry="10" fill="#009688"/>
  <rect x="30" y="346" width="240" height="10" fill="#009688"/>
  <text x="150" y="343" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Cluster A</text>
  <text x="150" y="358" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#B2DFDB">RKE2 · Production</text>

  <rect x="48" y="370" width="204" height="30" rx="6" ry="6" fill="#E0F2F1" stroke="#009688" stroke-width="1.5"/>
  <text x="150" y="390" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#009688">Fleet Agent</text>

  <rect x="48" y="410" width="204" height="28" rx="6" ry="6" fill="#FFF3E0" stroke="#FF5722" stroke-width="1.5"/>
  <text x="150" y="429" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#E65100">BundleDeployment</text>

  <rect x="48" y="448" width="204" height="35" rx="6" ry="6" fill="#F5F5F5" stroke="#9E9E9E" stroke-width="1"/>
  <text x="150" y="462" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555">App: database + webapp</text>
  <text x="150" y="476" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555">Version: v1.2.3</text>

  <!-- Arrow: Fleet Controller → Cluster A -->
  <path d="M 240,155 L 220,155 L 160,155 L 160,310" fill="none" stroke="#009688" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-down)"/>

  <!-- Cluster B -->
  <rect x="305" y="320" width="240" height="175" rx="10" ry="10" fill="#FFFFFF" stroke="#009688" stroke-width="2.5"/>
  <rect x="305" y="320" width="240" height="36" rx="10" ry="10" fill="#009688"/>
  <rect x="305" y="346" width="240" height="10" fill="#009688"/>
  <text x="425" y="343" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Cluster B</text>
  <text x="425" y="358" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#B2DFDB">K3s · Staging</text>

  <rect x="323" y="370" width="204" height="30" rx="6" ry="6" fill="#E0F2F1" stroke="#009688" stroke-width="1.5"/>
  <text x="425" y="390" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#009688">Fleet Agent</text>

  <rect x="323" y="410" width="204" height="28" rx="6" ry="6" fill="#FFF3E0" stroke="#FF5722" stroke-width="1.5"/>
  <text x="425" y="429" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#E65100">BundleDeployment</text>

  <rect x="323" y="448" width="204" height="35" rx="6" ry="6" fill="#F5F5F5" stroke="#9E9E9E" stroke-width="1"/>
  <text x="425" y="462" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555">App: webapp (canary)</text>
  <text x="425" y="476" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555">Version: v1.3.0-rc.1</text>

  <!-- Arrow: Fleet Controller → Cluster B -->
  <path d="M 425,160 L 425,310" fill="none" stroke="#009688" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-down)"/>

  <!-- Cluster C -->
  <rect x="580" y="320" width="240" height="175" rx="10" ry="10" fill="#FFFFFF" stroke="#009688" stroke-width="2.5"/>
  <rect x="580" y="320" width="240" height="36" rx="10" ry="10" fill="#009688"/>
  <rect x="580" y="346" width="240" height="10" fill="#009688"/>
  <text x="700" y="343" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Cluster C</text>
  <text x="700" y="358" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#B2DFDB">AKS · Development</text>

  <rect x="598" y="370" width="204" height="30" rx="6" ry="6" fill="#E0F2F1" stroke="#009688" stroke-width="1.5"/>
  <text x="700" y="390" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#009688">Fleet Agent</text>

  <rect x="598" y="410" width="204" height="28" rx="6" ry="6" fill="#FFF3E0" stroke="#FF5722" stroke-width="1.5"/>
  <text x="700" y="429" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#E65100">BundleDeployment</text>

  <rect x="598" y="448" width="204" height="35" rx="6" ry="6" fill="#F5F5F5" stroke="#9E9E9E" stroke-width="1"/>
  <text x="700" y="462" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555">App: all (dev branch)</text>
  <text x="700" y="476" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555">Version: latest</text>

  <!-- Arrow: Fleet Controller → Cluster C -->
  <path d="M 610,155 L 630,155 L 690,155 L 700,310" fill="none" stroke="#009688" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-down)"/>

  <!-- Legend -->
  <rect x="30" y="510" width="790" height="1" fill="#E0E0E0"/>
  <text x="425" y="495" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#9E9E9E">Fleet uses CRDs (GitRepo, Bundle, ClusterGroup) to sync workloads from Git to target clusters — no manual kubectl apply needed.</text>
</svg>