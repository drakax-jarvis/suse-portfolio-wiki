<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <rect width="800" height="480" fill="#ffffff" rx="6"/>

  <defs>
    <marker id="arrowTeal" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#009688"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle">VMware to SUSE — 3-Phase Migration Path</text>

  <!-- ===== PHASE 1: Co-Existence (left) ===== -->
  <rect x="25" y="50" width="230" height="340" rx="6" fill="#e0f2f1" stroke="#009688" stroke-width="2"/>
  <rect x="25" y="50" width="230" height="32" rx="6" fill="#009688"/>
  <rect x="25" y="76" width="230" height="6" fill="#009688"/>
  <text x="140" y="70" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Phase 1: Co-Existence</text>

  <!-- vSphere box -->
  <rect x="40" y="100" width="200" height="50" rx="6" fill="#f5f5f5" stroke="#9E9E9E" stroke-width="2"/>
  <text x="140" y="120" font-family="sans-serif" font-size="12" font-weight="bold" fill="#616161" text-anchor="middle">vSphere</text>
  <text x="140" y="138" font-family="sans-serif" font-size="10" fill="#616161" text-anchor="middle">Existing Infrastructure</text>

  <!-- Harvester box -->
  <rect x="40" y="165" width="200" height="50" rx="6" fill="#e0f2f1" stroke="#009688" stroke-width="2"/>
  <text x="140" y="185" font-family="sans-serif" font-size="12" font-weight="bold" fill="#004d40" text-anchor="middle">Harvester HCI</text>
  <text x="140" y="203" font-family="sans-serif" font-size="10" fill="#004d40" text-anchor="middle">New SUSE Platform</text>

  <!-- Side by side indicator -->
  <text x="140" y="240" font-family="sans-serif" font-size="11" fill="#004d40" text-anchor="middle">vSphere + Harvester</text>
  <text x="140" y="255" font-family="sans-serif" font-size="11" fill="#004d40" text-anchor="middle">side by side</text>

  <!-- Rancher managing both -->
  <rect x="40" y="270" width="200" height="36" rx="6" fill="#e0f2f1" stroke="#009688" stroke-width="1.5"/>
  <text x="140" y="292" font-family="sans-serif" font-size="11" font-weight="bold" fill="#004d40" text-anchor="middle">Rancher manages both</text>

  <!-- Live-migrate -->
  <rect x="40" y="318" width="200" height="36" rx="6" fill="#fff8e1" stroke="#FFA000" stroke-width="1.5"/>
  <text x="140" y="336" font-family="sans-serif" font-size="11" fill="#e65100" text-anchor="middle">Live-migrate</text>
  <text x="140" y="349" font-family="sans-serif" font-size="10" fill="#e65100" text-anchor="middle">non-critical VMs</text>

  <!-- ===== Arrow between Phase 1 and Phase 2 ===== -->
  <line x1="258" y1="220" x2="282" y2="220" stroke="#009688" stroke-width="2.5" marker-end="url(#arrowTeal)"/>

  <!-- ===== PHASE 2: Expansion (center) ===== -->
  <rect x="285" y="50" width="230" height="340" rx="6" fill="#e0f2f1" stroke="#009688" stroke-width="2"/>
  <rect x="285" y="50" width="230" height="32" rx="6" fill="#009688"/>
  <rect x="285" y="76" width="230" height="6" fill="#009688"/>
  <text x="400" y="70" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Phase 2: Expansion</text>

  <!-- RKE2 workloads -->
  <rect x="300" y="100" width="200" height="42" rx="6" fill="#e0f2f1" stroke="#009688" stroke-width="1.5"/>
  <text x="400" y="120" font-family="sans-serif" font-size="11" font-weight="bold" fill="#004d40" text-anchor="middle">RKE2 Container Workloads</text>
  <text x="400" y="135" font-family="sans-serif" font-size="10" fill="#004d40" text-anchor="middle">Run containers alongside VMs</text>

  <!-- NeuVector -->
  <rect x="300" y="155" width="200" height="36" rx="6" fill="#e0f2f1" stroke="#009688" stroke-width="1.5"/>
  <text x="400" y="177" font-family="sans-serif" font-size="11" font-weight="bold" fill="#004d40" text-anchor="middle">NeuVector Security</text>

  <!-- Fleet GitOps -->
  <rect x="300" y="204" width="200" height="36" rx="6" fill="#e0f2f1" stroke="#009688" stroke-width="1.5"/>
  <text x="400" y="226" font-family="sans-serif" font-size="11" font-weight="bold" fill="#004d40" text-anchor="middle">Fleet GitOps</text>

  <!-- Phase out -->
  <rect x="300" y="270" width="200" height="36" rx="6" fill="#fff8e1" stroke="#FFA000" stroke-width="1.5"/>
  <text x="400" y="292" font-family="sans-serif" font-size="11" fill="#e65100" text-anchor="middle">Begin phasing out vSphere</text>

  <!-- ===== Arrow between Phase 2 and Phase 3 ===== -->
  <line x1="518" y1="220" x2="542" y2="220" stroke="#009688" stroke-width="2.5" marker-end="url(#arrowTeal)"/>

  <!-- ===== PHASE 3: Modernization (right) ===== -->
  <rect x="545" y="50" width="230" height="340" rx="6" fill="#e0f2f1" stroke="#009688" stroke-width="2"/>
  <rect x="545" y="50" width="230" height="32" rx="6" fill="#009688"/>
  <rect x="545" y="76" width="230" height="6" fill="#009688"/>
  <text x="660" y="70" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Phase 3: Modernization</text>

  <!-- Full SUSE platform -->
  <rect x="560" y="100" width="200" height="50" rx="6" fill="#e0f2f1" stroke="#009688" stroke-width="2"/>
  <text x="660" y="120" font-family="sans-serif" font-size="12" font-weight="bold" fill="#004d40" text-anchor="middle">Full SUSE Platform</text>
  <text x="660" y="138" font-family="sans-serif" font-size="10" fill="#004d40" text-anchor="middle">VMs + Containers on SUSE</text>

  <!-- Edge via K3s/Elemental -->
  <rect x="560" y="165" width="200" height="36" rx="6" fill="#e0f2f1" stroke="#009688" stroke-width="1.5"/>
  <text x="660" y="187" font-family="sans-serif" font-size="11" fill="#004d40" text-anchor="middle">Edge via K3s / Elemental</text>

  <!-- SAP on Rancher -->
  <rect x="560" y="215" width="200" height="36" rx="6" fill="#fff8e1" stroke="#FFA000" stroke-width="1.5"/>
  <text x="660" y="237" font-family="sans-serif" font-size="11" font-weight="bold" fill="#e65100" text-anchor="middle">SAP on Rancher</text>

  <!-- Bottom label: "No rip-and-replace" -->
  <rect x="250" y="400" width="300" height="36" rx="6" fill="#fff8e1" stroke="#FFA000" stroke-width="2"/>
  <text x="400" y="423" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e65100" text-anchor="middle">🔄 No rip-and-replace</text>
</svg>
