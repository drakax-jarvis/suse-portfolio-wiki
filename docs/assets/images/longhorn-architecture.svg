<text x="350" y="85" text-anchor="middle" fill="#eceff1" font-family="sans-serif" font-size="12" font-weight="bold">Longhorn Manager + CSI Driver</text>
<text x="350" y="130" text-anchor="middle" fill="#78909c" font-family="sans-serif" font-size="11">Each volume gets a dedicated controller + N synchronous replicas</text>
