  <text x="350" y="71" text-anchor="middle" font-size="9" fill="#E0F2F1">Multi-Cluster Mgmt · Fleet · OCI Registry</text>

  <line x1="350" y1="80" x2="350" y2="92" stroke="#009688" stroke-width="2"/>

  <!-- Row 1: RKE2, K3s, Harvester -->
  <rect x="45" y="95" width="180" height="45" rx="5" fill="#00796B" stroke="#00695C" stroke-width="2"/>
