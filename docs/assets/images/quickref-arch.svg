  <rect x="475" y="95" width="180" height="45" rx="5" fill="#00796B" stroke="#00695C" stroke-width="2"/>
  <text x="565" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Harvester (VM)</text>
  <text x="565" y="130" text-anchor="middle" font-size="9" fill="#E0F2F1">KubeVirt · 3x Density</text>

  <line x1="135" y1="80" x2="135" y2="92" stroke="#009688" stroke-width="2"/>
  <line x1="565" y1="80" x2="565" y2="92" stroke="#009688" stroke-width="2"/>

  <!-- Row 2: NeuVector, Longhorn, Kubewarden -->
  <rect x="45" y="155" width="180" height="45" rx="5" fill="#FF5722" stroke="#E64A19" stroke-width="2"/>
