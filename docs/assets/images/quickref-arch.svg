<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="Arial, sans-serif">
  <rect width="700" height="380" fill="#FAFAFA" rx="8"/>

  <text x="350" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">SUSE Portfolio — Quick Reference Architecture</text>

  <!-- Rancher Prime -->
  <rect x="225" y="40" width="250" height="40" rx="6" fill="#009688" stroke="#00796B" stroke-width="2"/>
