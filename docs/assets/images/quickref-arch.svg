  <text x="135" y="190" text-anchor="middle" font-size="9" fill="#FFE0B2">Security · Zero-Trust · DLP/WAF</text>

  <rect x="260" y="155" width="180" height="45" rx="5" fill="#00796B" stroke="#00695C" stroke-width="2"/>
  <text x="350" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Longhorn</text>
  <text x="350" y="190" text-anchor="middle" font-size="9" fill="#E0F2F1">Storage · Replication · NVMe-oF</text>

  <rect x="475" y="155" width="180" height="45" rx="5" fill="#00796B" stroke="#00695C" stroke-width="2"/>
