  <text x="135" y="130" text-anchor="middle" font-size="9" fill="#E0F2F1">FIPS · CIS · SAP Certified</text>

  <rect x="260" y="95" width="180" height="45" rx="5" fill="#00796B" stroke="#00695C" stroke-width="2"/>
